name = "botmanager-worker"
main = "src/index.ts"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]

# ─── D1 Database ────────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "botmanager-db"
database_id = "0563146a-7cd8-4223-97e2-a4086202be01"

# ─── R2 Storage (file uploads) ──────────────────────────────────────────────────
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "botmanager-files"       # wrangler r2 bucket create botmanager-files

# ─── KV (rate-limit counters, short-lived tokens) ────────────────────────────
[[kv_namespaces]]
binding = "KV"
id = "b1d847ab7a214b979cfa2646f780c644"

# ─── Secrets ──────────────────────────────────────────────────────────────────
# Pushed automatically by .github/workflows/deploy-worker.yml from GitHub
# Secrets on every deploy. To set them by hand instead: wrangler secret put <NAME>
# JWT_SECRET       — random 64-char string for signing session tokens
# FCM_SERVER_KEY   — Firebase Cloud Messaging legacy server key

[vars]
CORS_ORIGIN = "*"

[dev]
port = 8787
local_protocol = "http"

# Cloudflare Realtime TURN (set as Worker secrets; never expose in Expo config)
# TURN_KEY_ID          — uid returned when a Realtime TURN key is created
# TURN_KEY_API_TOKEN   — 64-character bearer key returned once with that TURN key
