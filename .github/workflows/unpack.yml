name: Install completed Relay source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Replace transfer files with completed source
        run: |
          mkdir ../relay-final
          tar -xzf 3-relay-complete-nowf.tgz -C ../relay-final
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a ../relay-final/. .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete Relay phases 1-30"
          git push origin HEAD:main
