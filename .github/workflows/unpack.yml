name: Install completed Relay source
on:
  push:
    branches: [main]
    paths: [relay-complete.tgz]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace transfer files with completed source
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name relay-complete.tgz -exec rm -rf {} +
          tar -xzf relay-complete.tgz
          rm relay-complete.tgz
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete Relay phases 1-30" || exit 0
          git push origin HEAD:main
