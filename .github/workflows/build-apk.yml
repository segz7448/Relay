name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: "1"
  CI: "1"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_WORKER_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
      GOOGLE_SERVICES_FILE: ${{ github.workspace }}/google-services.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # android/ is generated by Expo prebuild below, so cache Gradle afterward.

      - name: Check required Android build configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_WORKER_URL" || { echo '::error::Missing repository variable CLOUDFLARE_WORKER_URL'; exit 1; }
          test -n "${{ secrets.FCM_GOOGLE_SERVICES_JSON_BASE64 }}" || { echo '::error::Missing Actions secret FCM_GOOGLE_SERVICES_JSON_BASE64'; exit 1; }

      - name: Restore Firebase Android configuration
        shell: bash
        run: printf '%s' '${{ secrets.FCM_GOOGLE_SERVICES_JSON_BASE64 }}' | base64 --decode > "$GOOGLE_SERVICES_FILE"

      - name: Install dependencies
        run: npm ci

      - name: API parity check (frontend/backend contract)
        run: npm run parity

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build Expo development APK and standalone release APK
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Expo development APK
        uses: actions/upload-artifact@v4
        with:
          name: relay-android-development-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload standalone release APK
        uses: actions/upload-artifact@v4
        with:
          name: relay-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
